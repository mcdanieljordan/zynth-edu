<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battleship Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@400;700&family=Bangers&family=Baloo+2:wght@400;600;700&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Pirata+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Battleship Jeopardy v2. Theme tokens are set on :root by applyTheme(); the active team's color floods the page background. */
:root{
  --disp:'Bungee','Arial Black',sans-serif; --body:'Fredoka','Trebuchet MS',sans-serif;
  --panel:#FFFFFF; --pInk:#10264A; --line:#10264A; --lw:3px; --r:20px; --sh:0 6px 0 #10264A;
  --head:#10264A; --headInk:#FFFFFF; --tile:#FFC62E; --tileInk:#10264A; --tline:#10264A; --tsh:0 4px 0 #10264A;
  --used:#D6E2EF; --usedInk:#5B7396; --btn:#26C46B; --btnInk:#10264A;
  --ink:#10264A; --inkRgb:16,38,74; --bgHex:#2E9BE6; --soft:rgba(16,38,74,.14); --softLine:rgba(16,38,74,.28); --pSoft:rgba(16,38,74,.08);
  --good:#1F9D55; --bad:#D64545; --s:1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg,#2E9BE6);background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.playing{overflow:hidden;height:100%}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.disp{font-family:var(--disp)}

/* ---------- shared pieces ---------- */
.card{background:var(--panel);color:var(--pInk);border:var(--lw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:8px 26px;border-radius:calc(var(--r) - 6px);border:var(--lw) solid var(--line);background:var(--btn);color:var(--btnInk);box-shadow:var(--tsh);font-family:var(--disp);font-size:22px;line-height:1.1;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn:disabled{opacity:.5;box-shadow:none}
.btn.sm{min-height:46px;padding:6px 18px;font-size:18px}
.btn.lg{min-height:68px;font-size:28px}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--pInk);box-shadow:none}
.btn.sun{background:var(--tile);color:var(--tileInk)}
.btn.bad{background:var(--bad);color:#fff}
.chip{display:inline-flex;align-items:center;padding:6px 16px;border-radius:99px;font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap;background:var(--soft);color:var(--ink)}
.chip.solid{background:var(--head);color:var(--headInk)}
.chip.pan{background:var(--pSoft);color:var(--pInk)}
.ibtn{width:48px;height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--soft);color:var(--ink);font-weight:700}
.ibtn.wide{width:auto;padding:0 16px;font-size:19px}
.badge{flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);line-height:1}

/* ---------- setup screen (scrolls) ---------- */
#setup{max-width:1200px;margin:0 auto;padding:22px 22px 80px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hdr h1{font-family:var(--disp);font-weight:400;font-size:clamp(30px,5vw,48px);line-height:1;color:var(--ink)}
.hdr .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{margin:0 0 20px;font-size:22px;font-weight:600;max-width:820px;line-height:1.3}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.grid2{grid-template-columns:1fr}}
.card h3{font-family:var(--disp);font-weight:400;font-size:26px;margin-bottom:12px}
.stack{display:grid;gap:16px}
.lbl{display:block;font-size:18px;font-weight:700;margin-bottom:6px}
.note{font-size:17px;line-height:1.35;opacity:.8}
.field{margin-bottom:14px}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:3px solid var(--line);background:#fff;color:#10264A;font-size:20px;font-weight:600}
textarea{resize:vertical;line-height:1.3}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:48px;padding:0 12px;border-radius:12px;border:3px solid var(--line);background:#fff;color:#10264A;font-weight:700;font-size:20px}
.seg button[aria-pressed=true]{background:var(--tile);color:var(--tileInk);box-shadow:var(--tsh)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:10px 0;font-size:20px;font-weight:700;line-height:1.2;cursor:pointer}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl .tr{flex:none;width:60px;height:34px;border-radius:99px;border:3px solid var(--line);background:#D6E2EF;padding:2px;display:flex;justify-content:flex-start;transition:background .15s}
.tgl .tr i{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tgl input:checked + .tr{background:var(--good);justify-content:flex-end}
.tgl input:focus-visible + .tr{outline:4px solid var(--ink);outline-offset:3px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;border-radius:14px;border:3px solid var(--line);background:#fff;color:#10264A;font-weight:700;font-size:17px;line-height:1.1;min-height:84px}
.th[aria-pressed=true]{background:#FFF3C4;box-shadow:0 3px 0 var(--line)}
.th i{display:block;width:100%;height:34px;border-radius:8px;border:2px solid #10264A}
.trow{display:grid;grid-template-columns:56px minmax(0,1fr) 150px 44px;gap:10px;align-items:start;padding:10px;border-radius:16px;background:var(--pSoft);margin-bottom:10px}
.trow .badge{width:56px;height:56px;font-size:20px}
.trow textarea{grid-column:2 / 4;min-height:44px;font-size:18px}
.trow .x{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:#10264A}
.resume{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px;background:var(--tile);color:var(--tileInk)}
.resume b{font-size:22px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:22px}
@media (max-width:960px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:17px;line-height:1.25}
.steps b{display:block;font-size:19px;margin-bottom:2px}

/* ---------- game stage (fixed 1440x900, scaled to fit) ---------- */
#game{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;margin:-450px 0 0 -720px;transform:scale(var(--s));transform-origin:center center;padding:18px 28px 22px;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
.top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between}
.top .l{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-family:var(--disp);font-size:28px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.top .r{display:flex;gap:10px}
.banner{height:104px;flex:none;display:flex;align-items:center;gap:24px}
.banner .badge{width:96px;height:96px;background:var(--ink);color:var(--bgHex);font-size:46px}
.bn-name{font-family:var(--disp);line-height:1.02;white-space:nowrap}
.bn-sub{font-size:30px;font-weight:700;line-height:1.1;margin-top:2px}
.cols{height:680px;flex:none;display:flex;gap:20px}
.left,.qleft,.qright{width:300px;flex:none;padding:18px;border-radius:var(--r);background:var(--soft);border:2px solid var(--softLine);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cap{font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.upname{font-family:var(--disp);line-height:1.04;overflow-wrap:anywhere}
.mems{display:flex;flex-direction:column;gap:6px}
.mem{padding:4px 12px;font-size:28px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.mem.up{padding:6px 12px;border-radius:12px;font-size:30px;font-weight:700;background:var(--ink);color:var(--bgHex)}
.shp .row{display:flex;justify-content:space-between;font-size:20px;font-weight:700}
.bar{height:14px;border-radius:99px;background:rgba(var(--inkRgb),.22);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:99px}
.shp.sunk{opacity:.45;text-decoration:line-through}
.board{flex:1;min-width:0;padding:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:72px repeat(5,minmax(0,1fr));gap:10px;background:var(--panel);color:var(--pInk);border:var(--lw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 6px;border-radius:calc(var(--r) - 8px);background:var(--head);color:var(--headInk)}
.cat b{font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.05}
.tile{position:relative;display:flex;align-items:center;justify-content:center;border-radius:calc(var(--r) - 8px);border:var(--lw) solid var(--tline);background:var(--tile);color:var(--tileInk);box-shadow:var(--tsh);font-family:var(--disp);font-size:40px;line-height:1}
.tile:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
.tile:disabled{cursor:not-allowed}
.tile.used{border-style:dashed;border-color:var(--usedInk);background:var(--used);color:var(--usedInk);box-shadow:none}
.tile .bolt{position:absolute;top:6px;right:6px}
.tile.lock{opacity:.55}
.side{width:300px;flex:none;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel);color:var(--pInk);border:var(--lw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.side h4{font-family:var(--disp);font-weight:400;font-size:22px;padding:2px 4px}
.sq{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--pSoft)}
.sq .badge{width:40px;height:40px;font-size:18px}
.sq .nm{font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq .hb{display:flex;align-items:center;gap:8px;margin-top:4px}
.sq .hb .bar{flex:1;height:12px;margin:0;background:rgba(128,128,128,.28)}
.sq .hb span{font-size:16px;font-weight:700;min-width:40px;text-align:right}
.sq>div:last-child{flex:1;min-width:0}
.sq.on{background:var(--ink);color:var(--bgHex)}
.sq.out{opacity:.5}
.compact .sq{padding:4px 8px}.compact .sq .badge{width:30px!important;height:30px!important;font-size:13px!important}.compact .sq .nm{font-size:17px}.compact .sq .hb{margin-top:2px}.compact .side{gap:5px}

/* ---------- question layer (inside the stage) ---------- */
#qlayer{position:absolute;inset:0;padding:18px 28px 22px;display:flex;flex-direction:column;gap:14px;z-index:20}
#qlayer .bg{position:absolute;inset:0;z-index:-1;background:var(--bg);background-attachment:fixed}
.qcols{height:680px;flex:none;display:flex;gap:20px}
.qmid{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--panel);color:var(--pInk);border:var(--lw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.qtext{font-family:var(--disp);font-size:40px;line-height:1.14;overflow-wrap:anywhere}
.qtext.eq{font-size:64px;text-align:center;padding:14px 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:16px;min-height:92px;padding:12px 18px;text-align:left;font-size:36px;font-weight:700;line-height:1.1;border-radius:calc(var(--r) - 6px);border:var(--lw) solid var(--tline);background:var(--tile);color:var(--tileInk);box-shadow:var(--tsh)}
.opt:hover:not(:disabled){filter:brightness(1.07)}
.opt b{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:400;font-size:24px;background:var(--head);color:var(--headInk)}
.opt span{flex:1;overflow-wrap:anywhere}
.opt.ok{background:var(--good);color:#fff;border-color:var(--line)}
.opt.ok b{background:#fff;color:var(--good)}
.opt.no{background:var(--bad);color:#fff}
.opt.no b{background:#fff;color:var(--bad)}
.opt.dim{border-style:dashed;border-color:var(--usedInk);background:var(--used);color:var(--usedInk);box-shadow:none}
.fb{padding:12px 16px;border-radius:14px;background:var(--pSoft);font-size:22px;line-height:1.3}
.fb h3{font-family:var(--disp);font-weight:400;font-size:28px;margin-bottom:4px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.qright{align-items:center;text-align:center}
.qright .fb{width:100%;text-align:left;background:rgba(var(--inkRgb),.14);color:var(--ink)}
.qright .fb h3{color:var(--ink)}
.ring{position:relative;width:190px;height:190px;flex:none}
.ring svg{display:block}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n b{font-family:var(--disp);font-weight:400;font-size:66px;line-height:1}
.ring .n small{font-size:18px;font-weight:700}
.tctl{display:flex;gap:8px;justify-content:center}
.big{font-family:var(--disp);font-weight:400;font-size:52px;line-height:1}
.pendbar{display:flex;height:30px;border-radius:99px;overflow:hidden;background:rgba(var(--inkRgb),.22)}
.note-box{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bgHex);font-size:22px;font-weight:700;line-height:1.2}
.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:auto;padding:4px}
.tgt{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:78px;border-radius:calc(var(--r) - 6px);border:var(--lw) solid var(--line);background:var(--tc);color:var(--ti);text-align:left}
.tgt .badge{width:48px;height:48px;font-size:20px;background:var(--ti);color:var(--tc)}
.tgt b{display:block;font-size:24px;line-height:1.1}.tgt small{font-size:17px;font-weight:600}
.tgt.sel{outline:5px solid var(--pInk);outline-offset:2px}
.sea{display:grid;grid-template-columns:36px repeat(7,64px);grid-auto-rows:64px;gap:6px;align-items:center;justify-items:center;margin:0 auto}
.sea .ax{font-weight:700;font-size:20px}
.sc{width:64px;height:64px;border-radius:12px;border:3px solid var(--line);background:rgba(var(--inkRgb),.10);color:var(--pInk);font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center}
.sc:hover:not(:disabled){background:rgba(var(--inkRgb),.25)}
.sc.m{background:rgba(var(--inkRgb),.35)}
.sc.n{background:#FFE7A3;color:#10264A}
.sc.h{background:var(--bad);color:#fff}
.sc.s{background:#111;color:#fff;border-color:#111}
.sc:disabled{cursor:not-allowed}
.calc{width:100%;border-collapse:collapse;font-size:24px}
.calc td{padding:6px 4px;border-bottom:2px solid var(--pSoft)}
.calc td:last-child{text-align:right;font-weight:700}
.calc tr.tot td{font-weight:700;border-bottom:0;font-size:28px}

/* ---------- modal + victory ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--panel);color:var(--pInk);border:var(--lw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.sheet h2{font-family:var(--disp);font-weight:400;font-size:30px;margin-bottom:12px}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.glist .g{padding:8px 12px;border-radius:12px;background:var(--tc);color:var(--ti);font-size:18px;line-height:1.25}
.glist .g b{font-size:20px}
#victory{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.45)}
.vbox{width:min(980px,100%);max-height:94vh;overflow:auto;background:var(--panel);color:var(--pInk);border:var(--lw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:26px;text-align:center}
.vbox h2{font-family:var(--disp);font-weight:400;font-size:44px;line-height:1.1;margin:6px 0}
.vbox .wn{display:inline-block;padding:2px 18px;border-radius:14px;background:var(--wc);color:var(--wi)}
.stats{width:100%;border-collapse:collapse;font-size:20px;margin:14px 0;text-align:left}
.stats th,.stats td{padding:8px 10px;border-bottom:2px solid var(--pSoft)}
.stats th{font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.stats .dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--tc);margin-right:8px;vertical-align:-2px}
.row2{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:200}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-10px 0}40%{translate:9px 0}60%{translate:-6px 0}80%{translate:4px 0}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.btn,.tile{transition:none}}

/* ================================================================
   HOLO DECK: futuristic skin + 3D layout + camera zoom animations + voice HUD
   - html[data-theme="holo"] = hologram look (set by applyTheme)
   - #stage.d3 = tilted 3D panels + zoom in/out camera moves (toggle in Look)
   ================================================================ */
:root{--acc:#88DAF2;--accRgb:136,218,242;--px:0;--py:0}

/* ---------- always-on pieces (any theme) ---------- */
.proj{flex:none;position:relative;width:96px;height:96px}
.fleet2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px;margin-top:6px}
.tile.surge{animation:surgePulse 1.3s ease-in-out infinite}
@keyframes surgePulse{0%,100%{box-shadow:var(--tsh)}50%{box-shadow:var(--tsh),0 0 22px 6px rgba(255,214,64,.85)}}
.opts .opt{animation:optIn .45s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--oi,0)*70ms)}
@keyframes optIn{from{opacity:0;translate:0 26px;scale:.92}to{opacity:1;translate:0 0;scale:1}}
.sea.punch{animation:punch .5s ease-out}
@keyframes punch{0%{scale:1}30%{scale:1.1}100%{scale:1}}
.sea.pull{animation:pullS 1s ease-out}
@keyframes pullS{0%{scale:1.18;filter:brightness(1.7)}100%{scale:1;filter:none}}
.modal:not([hidden]) .sheet{animation:popIn .35s cubic-bezier(.2,.9,.3,1.15)}
#victory:not([hidden]) .vbox{animation:camIn .8s cubic-bezier(.16,.84,.3,1)}
@keyframes popIn{from{opacity:0;scale:.86}to{opacity:1;scale:1}}

/* iris wipe: the old team color shrinks toward the badge, revealing the new team's color */
#wipe{position:fixed;inset:0;z-index:1;pointer-events:none;display:none}
#wipe.go{display:block;animation:iris .72s cubic-bezier(.65,0,.3,1) forwards}
@keyframes iris{from{clip-path:circle(150% at 7% 17%)}to{clip-path:circle(0% at 7% 17%)}}

/* ---------- camera moves (3D on) ---------- */
@keyframes camIn{from{opacity:0;transform:perspective(1100px) translateZ(-620px) rotateX(10deg);filter:blur(10px) brightness(1.8)}
  55%{filter:blur(0) brightness(1.2)}
  to{opacity:1;transform:perspective(1100px) translateZ(0) rotateX(0);filter:none}}
@keyframes camOut{from{opacity:0;transform:perspective(1100px) translateZ(480px);filter:blur(8px) brightness(1.7)}
  55%{opacity:1;filter:blur(0) brightness(1.2)}
  to{opacity:1;transform:perspective(1100px) translateZ(0);filter:none}}
@keyframes slideL{from{translate:-150px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes slideR{from{translate:150px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes tileBoot{from{opacity:0;transform:perspective(520px) rotateX(-75deg) translateZ(-70px)}to{opacity:1;transform:none}}
@keyframes holoIn{0%{opacity:0;letter-spacing:.35em;filter:blur(8px)}100%{opacity:1;letter-spacing:normal;filter:none}}

#stage.d3[data-anim="in"] .qcols{animation:camIn .75s cubic-bezier(.16,.84,.3,1) backwards}
#stage.d3[data-anim="out"] .qcols,#stage.d3[data-anim="out"] .cols{animation:camOut .8s cubic-bezier(.16,.84,.3,1) backwards}

#stage.d3[data-anim="boot"] .left,#stage.d3[data-anim="in"] .qleft{animation:slideL .7s cubic-bezier(.2,.8,.2,1) .12s backwards}
#stage.d3[data-anim="boot"] .side,#stage.d3[data-anim="in"] .qright{animation:slideR .7s cubic-bezier(.2,.8,.2,1) .12s backwards}

/* ---------- 3D layout: console panels angled toward the viewer ---------- */
#stage.d3 .left,#stage.d3 .qleft{transform:perspective(1500px) rotateY(calc(11deg + var(--px)*4deg));transform-origin:left center}
#stage.d3 .side,#stage.d3 .qright{transform:perspective(1500px) rotateY(calc(-11deg + var(--px)*4deg));transform-origin:right center}
#stage.d3 .board{transform:perspective(1900px) rotateX(calc(4deg - var(--py)*2deg)) rotateY(calc(var(--px)*2.5deg));transform-origin:50% 100%}
#stage.d3 .qmid{transform:perspective(1900px) rotateX(calc(3deg - var(--py)*2deg)) rotateY(calc(var(--px)*2deg));transform-origin:50% 100%}
#stage.d3 .tile:hover:not(:disabled){transform:perspective(600px) translateZ(26px) scale(1.04);z-index:2}
#stage.d3 .tile:active:not(:disabled){transform:perspective(600px) translateZ(8px)}

/* ================================================================
   HOLO DECK theme
   ================================================================ */
html[data-theme="holo"] body{letter-spacing:.01em}
#holoBg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;display:none}
html[data-theme="holo"] #holoBg{display:block}
#holoBg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,transparent 48%,rgba(0,0,0,.5) 100%)}
#holoBg::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 4px)}
#holoBg .floor{position:absolute;left:-20%;right:-20%;bottom:-6%;height:46%;overflow:hidden;transform:perspective(560px) rotateX(66deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 88%);mask-image:linear-gradient(to top,#000 0%,transparent 88%)}
#holoBg .floor::before{content:'';position:absolute;left:0;right:0;top:-96px;bottom:0;will-change:transform;
  background-image:linear-gradient(rgba(var(--accRgb),.55) 2px,transparent 2px),linear-gradient(90deg,rgba(var(--accRgb),.55) 2px,transparent 2px);
  background-size:96px 96px;animation:floorMove 3.6s linear infinite}
@keyframes floorMove{to{transform:translateY(96px)}}
/* one slow scan beam for the whole screen (cheap: it only moves, never repaints) */
#holoBg .sweep{position:absolute;left:0;right:0;top:0;height:220px;will-change:transform;
  background:linear-gradient(to bottom,transparent,rgba(var(--accRgb),.14),transparent);animation:sweepDown 8s linear infinite}
@keyframes sweepDown{from{transform:translateY(-220px)}to{transform:translateY(100vh)}}
#holoBg .beam{position:absolute;top:-10%;bottom:28%;width:20%;background:linear-gradient(to bottom,transparent,rgba(var(--accRgb),.20) 45%,transparent);animation:beamSway 8s ease-in-out infinite alternate}
#holoBg .b1{left:3%;transform:skewX(-14deg)}
#holoBg .b2{right:3%;transform:skewX(14deg);animation-delay:-4s}
@keyframes beamSway{from{opacity:.25}to{opacity:.95}}
#holoBg .parts i{position:absolute;bottom:-14px;width:var(--z);height:var(--z);border-radius:50%;background:rgba(var(--accRgb),.95);box-shadow:0 0 8px var(--acc);opacity:0;animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{translate:0 0;opacity:0}12%{opacity:.85}100%{translate:0 -112vh;opacity:0}}

/* glass panels with corner brackets and a slow scan beam */
html[data-theme="holo"] .card,html[data-theme="holo"] .board,html[data-theme="holo"] .left,html[data-theme="holo"] .qleft,
html[data-theme="holo"] .qright,html[data-theme="holo"] .qmid,html[data-theme="holo"] .side{position:relative}

html[data-theme="holo"] .qright::before,html[data-theme="holo"] .qmid::before,html[data-theme="holo"] .side::before{
  content:'';position:absolute;inset:-2px;pointer-events:none;z-index:3;
  background:
    linear-gradient(var(--acc),var(--acc)) top left/22px 3px no-repeat,linear-gradient(var(--acc),var(--acc)) top left/3px 22px no-repeat,
    linear-gradient(var(--acc),var(--acc)) top right/22px 3px no-repeat,linear-gradient(var(--acc),var(--acc)) top right/3px 22px no-repeat,
    linear-gradient(var(--acc),var(--acc)) bottom left/22px 3px no-repeat,linear-gradient(var(--acc),var(--acc)) bottom left/3px 22px no-repeat,
    linear-gradient(var(--acc),var(--acc)) bottom right/22px 3px no-repeat,linear-gradient(var(--acc),var(--acc)) bottom right/3px 22px no-repeat}

  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px)}
html[data-theme="holo"] .left,html[data-theme="holo"] .qleft,html[data-theme="holo"] .qright{
  background:linear-gradient(180deg,rgba(var(--accRgb),.16),rgba(var(--accRgb),.04)),rgba(3,10,26,.64);border:1px solid rgba(var(--accRgb),.55);
  box-shadow:0 0 22px rgba(var(--accRgb),.28),inset 0 0 30px rgba(var(--accRgb),.08)}
html[data-theme="holo"] .card,html[data-theme="holo"] .board,html[data-theme="holo"] .qmid,html[data-theme="holo"] .side,

#voiceHud .mic{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(var(--accRgb),.2);color:var(--acc)}
#voiceHud.live .mic::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--acc);animation:micPulse 1.4s ease-out infinite}
@keyframes micPulse{from{scale:.8;opacity:1}to{scale:1.35;opacity:0}}
#voiceHud .vt{display:flex;flex-direction:column;min-width:0}
#voiceHud small{font-size:16px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#voiceHud b{font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#voiceHud.ok b{color:#6BFFB5}#voiceHud.no b{color:#FFC27A}#voiceHud.err b{color:#FF8A98}
.vh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:8px 0 14px}
@media (max-width:700px){.vh{grid-template-columns:1fr}}
.vh>div{padding:10px 14px;border-radius:10px;background:var(--pSoft);font-size:19px;line-height:1.35}
.vh h4{font-family:var(--disp);font-weight:400;font-size:18px;margin-bottom:4px;letter-spacing:.04em}
.say{display:inline-block;padding:1px 10px;margin:2px 4px 2px 0;border-radius:99px;border:1px solid rgba(128,128,128,.55);font-weight:700;font-size:18px}

@media (prefers-reduced-motion:reduce){
  #stage,#stage *,#holoBg,#holoBg *,#wipe,.sheet,.vbox,.card,.hdr h1,.proj,.proj *,.sea::after,#voiceHud *{animation:none!important}
  .opts .opt,.tile.surge{animation:none!important}
}

/* reduced effects: switched on by the Look toggle, or automatically on a slow computer */
html.lite #holoBg .floor,html.lite #holoBg .parts,html.lite #holoBg .beam,html.lite #holoBg .sweep,html.lite .sea::after{display:none!important}
html.lite .proj::before,html.lite .proj::after,html.lite .banner .badge,html.lite .bn-name,html.lite .hdr h1,html.lite .ibtn.live,html.lite .tile.surge{animation:none!important}
html.lite #stage[data-anim],html.lite #stage[data-anim] *,html.lite #setup .card,html.lite #setup .grid2>.stack,html.lite .opts .opt{animation:none!important}
html.lite #stage.d3 .tile:hover:not(:disabled){transform:none}

/* stacking order: holoBg(0) < wipe(1) < setup/game(2) < victory(90) < modal(100) < hud(150) < fx(200) */
#setup{position:relative;z-index:2}
#game{z-index:2}

</style>

<body>
<div id="holoBg" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div><div class="floor"></div><div class="sweep"></div><div class="parts"></div></div>
<div id="wipe" aria-hidden="true"></div>
<main id="setup"></main>
<div id="game" hidden><div id="stage"></div></div>
<div id="victory" hidden><div class="vbox" id="vbox" role="dialog" aria-modal="true" aria-label="Final standings"></div></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="voiceHud" hidden aria-live="polite"><div class="mic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div><div class="vt"><small id="vHeard"></small><b id="vAct"></b></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
/* ============================ core rules (no DOM) ============================ */
const N=7;
const SHIPS={D:{name:'Dreadnought',len:4},C:{name:'Cruiser',len:3},F:{name:'Frigate',len:3},S:{name:'Scout',len:2}};
const SHIP_KEYS=['D','C','F','S'];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const r5=x=>Math.round(x/5)*5;

/* ---- squad colours: 6 vivid, then the same 6 as pastels, then the pattern repeats ---- */
const VIVID=['#FF4D5A','#2F8CFF','#26C46B','#FFC62E','#9B5DF5','#FF8B2B'];
const PASTEL=['#FFB8BF','#B5D3FF','#B7EBC9','#FFEBA3','#D9C6FF','#FFD2A6'];
const teamColor=i=>(Math.floor(i/6)%2===0?VIVID[i%6]:PASTEL[i%6]);
const DEFAULT_NAMES=['Red Rockets','Blue Barracudas','Green Gators','Yellow Yetis','Purple Pirates','Orange Orcas','Rose Rays','Sky Sharks','Mint Marlins','Lemon Lobsters','Lilac Llamas','Peach Penguins'];
const defaultName=i=>DEFAULT_NAMES[i%12]+(i>=12?' '+(Math.floor(i/12)+1):'');
const lum=h=>{const v=[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2];};
const inkFor=h=>{const L=lum(h);return (L+.05)/(0.0199+.05)>=1.05/(L+.05)?'#10264A':'#FFFFFF';};
const MAX_TEAMS=12;

/* ---- fleet layouts: 7 rows of 7 characters. D=Dreadnought(4) C=Cruiser(3) F=Frigate(3) S=Scout(2) ---- */
const DEFAULT_TEMPLATES=[
 {id:'d1',name:'Corner Patrol',on:true,rows:['DDDD..C','......C','......C','.......','.......','......S','FFF...S']},
 {id:'d2',name:'Crossroads',on:true,rows:['C.....S','C.....S','C..D...','...D...','...D...','...D...','....FFF']},
 {id:'d3',name:'Staircase',on:true,rows:['DDDD...','.......','..CCC..','.......','....FFF','.......','SS.....']},
 {id:'d4',name:'Twin Towers',on:true,rows:['.D...F.','.D...F.','.D...F.','.D.....','...C..S','...C..S','...C...']},
 {id:'d5',name:'Fortress',on:true,rows:['.......','..DDDD.','..C.F..','..C.F..','..C.F..','.S.....','.S.....']},
 {id:'d6',name:'Scattered',on:true,rows:['S.....F','S.....F','......F','....C..','....C..','....C..','DDDD...']}
];
function parseRows(rows){
  if(!Array.isArray(rows)||rows.length!==N||rows.some(r=>typeof r!=='string'||r.length!==N))return null;
  const out=[];let total=0;
  for(const k of SHIP_KEYS){
    const cells=[];
    rows.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch===k)cells.push([r,c]);}));
    if(cells.length!==SHIPS[k].len)return null;
    const sameR=cells.every(x=>x[0]===cells[0][0]),sameC=cells.every(x=>x[1]===cells[0][1]);
    if(!sameR&&!sameC)return null;
    const s=cells.map(x=>sameR?x[1]:x[0]).sort((a,b)=>a-b);
    if(!s.every((v,i)=>i===0||v===s[i-1]+1))return null;
    out.push({key:k,cells});total+=cells.length;
  }
  const letters=rows.join('').replace(/[.]/g,'').length;
  return letters===total?out:null;
}
const TF=[(r,c)=>[r,c],(r,c)=>[r,N-1-c],(r,c)=>[N-1-r,c],(r,c)=>[N-1-r,N-1-c],(r,c)=>[c,r],(r,c)=>[c,N-1-r],(r,c)=>[N-1-c,r],(r,c)=>[N-1-c,N-1-r]];
const transformShips=(ships,t)=>ships.map(s=>({key:s.key,cells:s.cells.map(([r,c])=>TF[t](r,c))}));
/* give every squad its own layout; reuse (flipped) only when there are more squads than layouts */
function assignFleets(n,templates,mix){
  let pool=templates.filter(t=>t.on&&parseRows(t.rows));
  if(!pool.length)pool=DEFAULT_TEMPLATES;
  let order=[],out=[];
  for(let i=0;i<n;i++){
    const reused=i>=pool.length;
    if(!order.length)order=shuffle(pool);
    const t=order.pop();
    let ships=parseRows(t.rows);
    if(mix||reused)ships=transformShips(ships,R(0,7));
    out.push({ships,tpl:t.name});
  }
  return out;
}

/* ---- teams, hit points, shots ---- */
function hpPerShip(total,count){return Math.max(10,r5(total/count));}
function makeTeam(def,i,cfg,fleet){
  const per=hpPerShip(cfg.hp,fleet.ships.length);
  const ships=fleet.ships.map(s=>({key:s.key,name:SHIPS[s.key].name,len:s.cells.length,cells:s.cells,hp:per,maxHp:per,hits:0,sunk:false}));
  const map=Array.from({length:N},()=>Array(N).fill(-1));
  ships.forEach((s,si)=>s.cells.forEach(([r,c])=>map[r][c]=si));
  const color=teamColor(i);
  return{name:(def.name||'').trim()||defaultName(i),members:(def.members||[]).slice(),grade:def.grade,color,ink:inkFor(color),
    ships,map,shots:Array.from({length:N},()=>Array(N).fill('')),alive:true,mi:0,tpl:fleet.tpl,
    stats:{shots:0,hits:0,sunk:0,right:0,asked:0,dealt:0,blocked:0}};
}
const teamHp=t=>t.ships.reduce((a,s)=>a+(s.sunk?0:s.hp),0);
const teamMax=t=>t.ships.reduce((a,s)=>a+s.maxHp,0);
const shipsAfloat=t=>t.ships.filter(s=>!s.sunk).length;

function shotAt(t,r,c,hints){
  const si=t.map[r][c];
  if(si<0){
    let near=false;
    if(hints)for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const y=r+a,x=c+b;if(y>=0&&x>=0&&y<N&&x<N&&t.map[y][x]>=0&&t.shots[y][x]!=='h'&&t.shots[y][x]!=='s')near=true;}
    t.shots[r][c]=near?'n':'m';
    return{type:near?'near':'miss'};
  }
  t.shots[r][c]='h';t.ships[si].hits++;
  return{type:'hit',si};
}
/* speed bonus: answering in the first third of the time gives x1.5, the second third x1.25 */
const speedMult=f=>f<.33?1.5:f<.66?1.25:1;
function calcDamage({value,surge,mult,shieldOk,shieldPct}){
  const base=value*(surge?2:1),dmg=r5(base*mult);
  const blocked=shieldOk?r5(dmg*shieldPct/100):0;
  return{base,dmg,blocked,final:dmg-blocked};
}
/* a ship goes down when its own HP runs out OR every square of it has been hit (its leftover HP is lost) */
function applyDamage(t,si,dmg){
  const s=t.ships[si],before=s.hp,taken=Math.min(before,dmg);
  s.hp=before-taken;
  let finishing=0,sunk=false;
  if(s.hp<=0||s.hits>=s.len){finishing=s.hp;s.hp=0;s.sunk=true;sunk=true;s.cells.forEach(([r,c])=>t.shots[r][c]='s');}
  if(t.ships.every(x=>x.sunk))t.alive=false;
  return{before,taken,finishing,sunk,eliminated:!t.alive};
}

/* ============================ mental math (always fresh, short, no paper) ============================ */
const sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]||d).join('');
const sub=n=>String(n).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]||d).join('');
const NM=['Emma','Liam','Ava','Noah','Mia','Lucas','Zoe','Ethan','Sofia','Mateo'];
const EM=['🍎','🍪','⭐','🎈','🐟','⚽','🍕','🧩','🚀','🐢'];

/* multiple choice from a number; wrong answers are near misses (off by 1, 2, 10...) */
function numQ(q,ans,exp,o={}){
  const u=o.u||1,fmt=o.fmt||String,seen=new Set([ans]),out=[];
  const lo=o.neg?-Infinity:(o.min!=null?o.min:0),hi=o.max!=null?o.max:Infinity;
  const add=v=>{v=+(+v).toFixed(4);if(!seen.has(v)&&v>=lo&&v<=hi&&out.length<3){seen.add(v);out.push(v);}};
  (o.x||[]).forEach(add);
  const d=[1,-1,2,-2,3,-3,5,-5,10,-10];if(Math.abs(ans)>=100)d.push(100,-100,20,-20);
  shuffle(d).forEach(k=>add(ans+k*u));
  for(let k=1;out.length<3&&k<60;k++)add(ans+k*u);
  return{q,a:fmt(ans),w:out.map(fmt),exp};
}
/* multiple choice from text answers */
const txtQ=(q,a,w,exp)=>({q,a,w:shuffle(w.filter(x=>x!==a)).slice(0,3),exp});

const add=(a,b,o)=>numQ(`${a} + ${b} = ?`,a+b,`${a} + ${b} = ${a+b}`,o);
const sbt=(a,b,o)=>numQ(`${a} − ${b} = ?`,a-b,`${a} − ${b} = ${a-b}`,o);
const mul=(a,b,o)=>numQ(`${a} × ${b} = ?`,a*b,`${a} × ${b} = ${a*b}`,Object.assign({x:[a+b]},o));
const div=(a,b)=>numQ(`${a*b} ÷ ${b} = ?`,a,`${a} × ${b} = ${a*b}, so ${a*b} ÷ ${b} = ${a}`,{x:[b]});
const gap=(a,t,o)=>numQ(`${a} + ? = ${t}`,t-a,`${a} + ${t-a} = ${t}`,o);
const gap2=(b,t,o)=>numQ(`? + ${b} = ${t}`,t-b,`${t-b} + ${b} = ${t}`,o);
const dbl=(a)=>numQ(`Double ${a} = ?`,a*2,`${a} + ${a} = ${a*2}`);
const half=(a)=>numQ(`Half of ${a*2} = ?`,a,`${a} + ${a} = ${a*2}`);
const skip=(s,st)=>{const n=[0,1,2,3].map(i=>s+i*st);return numQ(`${n.join(', ')}, ?`,s+4*st,`Count by ${st}s: next is ${s+4*st}`,{x:[s+5*st,s+3*st+1]});};
const nm=()=>pick(NM),em=()=>pick(EM);
/* short word problems: a name, a number, an emoji, one question */
const wAdd=(a,b,o)=>{const e=em();return numQ(`${nm()} has ${a} ${e}. Gets ${b} more. Total?`,a+b,`${a} + ${b} = ${a+b}`,o);};
const wSub=(a,b,o)=>{const e=em();return numQ(`${nm()} has ${a} ${e}. Gives ${b} away. Left?`,a-b,`${a} − ${b} = ${a-b}`,o);};
const wGrp=(a,b)=>{const e=em();return numQ(`${a} bags, ${b} ${e} in each. How many ${e}?`,a*b,`${a} × ${b} = ${a*b}`,{x:[a+b]});};
const wShare=(a,b)=>{const e=em();return numQ(`${a*b} ${e} shared by ${b} kids. Each gets?`,a,`${a*b} ÷ ${b} = ${a}`,{x:[b]});};
const wMore=(a,b)=>{const [n,m]=shuffle(NM).slice(0,2);return numQ(`${n} has ${a+b} ⭐. ${m} has ${a}. How many more?`,b,`${a+b} − ${a} = ${b}`);};
const wCost=(p,k)=>numQ(`1 snack costs $${p}. Buy ${k}. Total?`,p*k,`${k} × $${p} = $${p*k}`,{fmt:n=>'$'+n,x:[p+k]});
const wTime=(a,b)=>numQ(`Class is ${a} min. ${b} min are gone. Minutes left?`,a-b,`${a} − ${b} = ${a-b}`);
const frac=(n,d,w)=>{ /* n/d of w */
  const a=w/d*n;return numQ(`${n}/${d} of ${w} = ?`,a,`${w} ÷ ${d} = ${w/d}${n>1?`, then × ${n} = ${a}`:''}`,{x:[w/d]});};
const pct=(p,b)=>numQ(`${p}% of ${b} = ?`,b*p/100,`${p}% of ${b} = ${b*p/100}`,{x:[b-b*p/100]});
const rnd=(n,to)=>{if(n%to===0)n+=R(1,to-1);if(n%to===to/2)n+=1;const a=Math.round(n/to)*to;return numQ(`Round ${n} to the nearest ${to}`,a,`${n} is closest to ${a}`,{u:to});};
const fracAdd=()=>{const t=pick([[1,4,1,4,'1/2'],[1,2,1,4,'3/4'],[1,8,3,8,'1/2'],[2,5,1,5,'3/5'],[1,3,1,3,'2/3'],[3,10,2,10,'1/2'],[1,6,2,6,'1/2']]);
  const ans=t[4],pool=['1/2','3/4','2/3','1/4','3/5','2/5','4/5','3/8','5/6'];
  return txtQ(`${t[0]}/${t[1]} + ${t[2]}/${t[3]} = ?`,ans,shuffle(pool),`${t[0]}/${t[1]} + ${t[2]}/${t[3]} = ${ans}`);};
const bigger=(a,b)=>txtQ(`Which is bigger: ${a} or ${b}?`,String(Math.max(a,b)),[String(Math.min(a,b)),'They are equal','Can\'t tell'],`${Math.max(a,b)} is greater than ${Math.min(a,b)}`);
const intq=(a,op,b)=>{const ans=op==='+'?a+b:op==='−'?a-b:a*b;const A=a<0?`(${a})`:a,B=b<0?`(${b})`:b;
  return numQ(`${A} ${op} ${B} = ?`,ans,`${A} ${op} ${B} = ${ans}`,{neg:true,x:[-ans]});};
const solve=(a,x,b)=>{ /* a·x + b = total */
  const t=a*x+b;
  return numQ(a===1?`x + ${b} = ${t}`:`${a}x + ${b} = ${t}`,x,`${t} − ${b} = ${a*x}${a>1?`, then ÷ ${a} = ${x}`:''}`,{fmt:n=>'x = '+n,x:[t-b]});};
const solveMul=(a,x)=>numQ(`${a}x = ${a*x}`,x,`${a*x} ÷ ${a} = ${x}`,{fmt:n=>'x = '+n,x:[a]});
const TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[9,12,15],[8,15,17],[7,24,25]];

/* MATH[grade][tier]: a function that returns a fresh question. Tier 0 is easiest. */
const MATH=[
 /* K */[
  ()=>add(R(1,3),R(1,2),{max:6}),
  ()=>pick([()=>sbt(R(3,5),R(1,2),{max:6}),()=>wAdd(R(1,4),R(1,4),{max:9})])(),
  ()=>gap(R(1,9),10,{max:10}),
  ()=>pick([()=>wSub(R(5,9),R(1,4),{max:10}),()=>add(R(3,6),R(2,4),{max:11})])()],
 /* G1 */[
  ()=>pick([()=>add(R(2,6),R(2,4),{max:11}),()=>sbt(R(6,10),R(1,5),{max:10})])(),
  ()=>pick([()=>add(R(6,9),R(4,9)),()=>sbt(R(11,18),R(3,9))])(),
  ()=>pick([()=>gap2(R(3,9),R(11,18)),()=>gap(R(4,9),R(11,15))])(),
  ()=>pick([()=>wAdd(R(8,12),R(3,8)),()=>add(R(1,4)*10,R(1,4)*10),()=>wSub(R(12,19),R(3,9))])()],
 /* G2 */[
  ()=>pick([()=>add(R(7,9),R(5,9)),()=>sbt(R(13,18),R(5,9))])(),
  ()=>pick([()=>add(R(2,6)*10,R(1,3)*10),()=>sbt(R(5,9)*10,R(1,4)*10),()=>add(R(2,8)*10+R(0,9),10)])(),
  ()=>pick([()=>add(R(2,7)*10+R(1,5),R(1,2)*10),()=>sbt(R(5,9)*10+R(1,5),9),()=>skip(R(1,3)*5,5)])(),
  ()=>pick([()=>wAdd(R(2,6)*10+R(1,6),R(1,3)*10),()=>dbl(R(11,25)),()=>skip(R(2,9)*2,pick([2,10])),()=>wMore(R(12,30),R(3,9))])()],
 /* G3 */[
  ()=>pick([()=>mul(R(2,9),2),()=>mul(R(2,9),5),()=>mul(R(2,9),10)])(),
  ()=>pick([()=>mul(R(3,6),R(3,6)),()=>div(R(2,6),R(2,5)),()=>half(R(8,25))])(),
  ()=>pick([()=>mul(R(6,9),R(6,9)),()=>div(R(5,9),R(5,9)),()=>wGrp(R(3,7),R(3,8))])(),
  ()=>pick([()=>mul(R(2,9)*10,R(2,5)),()=>wShare(R(4,9),R(3,6)),()=>wCost(R(2,9),R(3,6)),()=>rnd(R(11,99),10)])()],
 /* G4 */[
  ()=>pick([()=>mul(R(6,9),R(6,9)),()=>div(R(6,9),R(6,9))])(),
  ()=>pick([()=>mul(R(11,19),R(2,5)),()=>mul(R(4,8),25),()=>mul(R(5,9),R(11,12))])(),
  ()=>pick([()=>frac(1,2,R(4,20)*2),()=>frac(1,4,R(3,12)*4),()=>frac(1,3,R(3,12)*3)])(),
  ()=>pick([()=>div(R(3,9)*100,R(2,5)),()=>mul(R(2,9),R(2,9)*10),()=>rnd(R(101,999),100),()=>wTime(60,R(2,9)*5)])()],
 /* G5 */[
  ()=>pick([()=>mul(R(7,9),R(7,12)),()=>div(R(7,12),R(7,9))])(),
  ()=>pick([()=>mul(R(12,25),4),()=>mul(R(3,9),R(15,25)),()=>{const a=R(1,4),b=R(1,5);return numQ(`0.${a} + 0.${b} = ?`,+(0.1*(a+b)).toFixed(1),`${a} tenths + ${b} tenths = ${a+b} tenths`,{fmt:n=>(+n).toFixed(1),u:.1});}])(),
  ()=>pick([()=>frac(3,4,R(2,8)*4),()=>frac(2,3,R(2,8)*3),()=>fracAdd()])(),
  ()=>pick([()=>{const a=R(2,9),b=R(2,6),c=R(2,6);return numQ(`${a} + ${b} × ${c} = ?`,a+b*c,`Multiply first: ${b} × ${c} = ${b*c}, then + ${a} = ${a+b*c}`,{x:[(a+b)*c]});},()=>pct(10,R(2,15)*10),()=>pct(50,R(3,20)*10)])()],
 /* G6 */[
  ()=>pick([()=>mul(R(11,15),R(6,9)),()=>mul(R(4,9),25),()=>div(R(12,16),R(6,9))])(),
  ()=>pick([()=>pct(25,R(2,12)*8),()=>pct(10,R(2,30)*10),()=>pct(50,R(3,20)*14)])(),

/* ============================ roster import (CSV / pasted text / Excel) ============================ */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt={'\t':0,',':0,';':0};for(const ch of first)if(ch in cnt)cnt[ch]++;
  let delim=',',best=0;for(const d of ['\t',',',';'])if(cnt[d]>best){best=cnt[d];delim=d;}
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=ch;
  }
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
const cleanName=s=>String(s||'').replace(/\s+/g,' ').trim();
const TEAM_HEAD=/^(team|group|squad|crew|table)(\s*(name|#|no\.?|number))?$/i;
const NAME_HEAD=/^(name|student|student name|full name|member|members|player|kid|child|scholar)$/i;
const FIRST_HEAD=/^(first|first name|given|given name|firstname)$/i;
const LAST_HEAD=/^(last|last name|surname|family name|lastname)$/i;

/* returns {mode:'groups'|'list', groups:[{name,members[]}], names:[...], note} */
function parseRoster(text){
  text=String(text||'').replace(/^﻿/,'');
  if(!text.trim())return{mode:'list',groups:[],names:[],note:'Nothing to read yet.'};
  /* blocks separated by blank lines = groups (title line optional) */
  if(/\n\s*\n/.test(text.trim())&&!/[,\t;]/.test(text)){
    const blocks=text.trim().split(/\n\s*\n/).map(b=>b.split(/\r?\n/).map(cleanName).filter(Boolean)).filter(b=>b.length);
    if(blocks.length>=2){
      const groups=blocks.map(b=>{const t=/^(team|group|squad|crew)\b/i.test(b[0])||/:$/.test(b[0]);return t?{name:b[0].replace(/:$/,''),members:b.slice(1)}:{name:'',members:b};});
      return{mode:'groups',groups,names:groups.flatMap(g=>g.members),note:'Groups read from blank-line breaks.'};
    }
  }
  const rows=parseCSV(text);
  if(!rows.length)return{mode:'list',groups:[],names:[],note:'Nothing to read yet.'};
  const head=rows[0].map(c=>c.toLowerCase());
  const ti=head.findIndex(c=>TEAM_HEAD.test(c)),ni=head.findIndex(c=>NAME_HEAD.test(c)),fi=head.findIndex(c=>FIRST_HEAD.test(c)),li=head.findIndex(c=>LAST_HEAD.test(c));
  const hasHeader=ti>=0||ni>=0||fi>=0;
  const body=hasHeader?rows.slice(1):rows;
  const nameOf=r=>{
    if(fi>=0&&li>=0)return cleanName((r[fi]||'')+' '+(r[li]||''));
    if(fi>=0)return cleanName(r[fi]);
    if(ni>=0)return cleanName(r[ni]);
    return null;
  };
  /* long format: one student per row with a team column */
  if(ti>=0&&(ni>=0||fi>=0)){
    const map=new Map();
    body.forEach(r=>{const t=cleanName(r[ti]),n=nameOf(r);if(!n)return;const k=t||'(no team)';if(!map.has(k))map.set(k,[]);map.get(k).push(n);});
    const groups=[...map].map(([name,members])=>({name:name==='(no team)'?'':name,members}));
    return{mode:'groups',groups,names:groups.flatMap(g=>g.members),note:`Found ${groups.length} group${groups.length===1?'':'s'} in the file.`};
  }
  /* wide format: team name then members across the row */
  if(ti>=0){
    const groups=body.map(r=>({name:cleanName(r[ti]),members:r.filter((c,i)=>i!==ti&&cleanName(c)).map(cleanName)})).filter(g=>g.name||g.members.length);
    return{mode:'groups',groups,names:groups.flatMap(g=>g.members),note:`Found ${groups.length} group${groups.length===1?'':'s'} in the file.`};
  }
  /* no header: if the first column repeats, it is a team column */
  if(!hasHeader&&body.length&&body.every(r=>r.length>=2)){
    const col=body.map(r=>cleanName(r[0]));
    if(new Set(col).size<col.length){
      const map=new Map();
      body.forEach(r=>{const t=cleanName(r[0]),n=cleanName(r.slice(1).filter(Boolean).join(' '));if(!n)return;if(!map.has(t))map.set(t,[]);map.get(t).push(n);});
      const groups=[...map].map(([name,members])=>({name,members}));
      return{mode:'groups',groups,names:groups.flatMap(g=>g.members),note:`Found ${groups.length} group${groups.length===1?'':'s'} in the file.`};
    }
  }
  /* plain list of students */
  let names;
  if(hasHeader)names=body.map(r=>nameOf(r)||cleanName(r[0])).filter(Boolean);
  else names=body.map(r=>cleanName(r.filter(Boolean).join(' '))).filter(Boolean);
  const seen=new Set();names=names.filter(n=>{const k=n.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  return{mode:'list',groups:[],names,note:`Found ${names.length} student${names.length===1?'':'s'}.`};
}
/* split a list into k balanced groups (shuffled) */
function splitGroups(names,k,doShuffle=true){
  k=Math.max(1,Math.min(k,names.length||1));
  const list=doShuffle?shuffle(names):names.slice();
  const groups=Array.from({length:k},()=>[]);
  list.forEach((n,i)=>groups[i%k].push(n));
  return groups;
}

/* ============================ sound: built-in synth + your own uploads ============================ */
const SOUND_SLOTS=[
 {key:'fire',label:'Cannon fire',hint:'A square is chosen'},
 {key:'hit',label:'Hit',hint:'A ship takes a hit'},
 {key:'miss',label:'Miss',hint:'Shot lands in open water'},
 {key:'deflect',label:'Deflected',hint:'A shield blocks damage'},
 {key:'sunk',label:'Ship sunk',hint:'A ship goes down'},
 {key:'correct',label:'Correct answer',hint:'Right answer'},
 {key:'wrong',label:'Wrong answer',hint:'Wrong answer or time out'},
 {key:'win',label:'Victory',hint:'A squad wins'}
];
const Snd=(()=>{
  let ctx=null,master=null,noiseBuf=null,vol=.85,on=true,db=null,persist=true;
  const custom={},playing={};
  const MAXCLIP=6000;
  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      ctx=new AC();master=ctx.createGain();master.gain.value=vol;master.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*1.5,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  const T=()=>ctx.currentTime;
  function osc(type,f0,f1,t0,dur,v,atk=.01){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t0);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+atk);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
  }
  function noise(t0,dur,v,type='lowpass',f0=2000,f1=200,q=1){
    const s=ctx.createBufferSource();s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter();f.type=type;f.Q.value=q;
    f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*.4);s.stop(t0+dur+.05);
  }
  function boom(t,size=1){
    noise(t,.95*size,.9,'lowpass',2400,50,.7);
    osc('sine',150,26,t,.85*size,1);
    noise(t+.015,.35,.4,'highpass',4200,900,.8);
    osc('sawtooth',90,30,t,.5*size,.22);
  }
  const synth={
    click:()=>{const t=T();osc('square',760,520,t,.05,.07);},
    tick:()=>{const t=T();osc('square',1100,1100,t,.04,.08);},
    pick:()=>{const t=T();noise(t,.28,.28,'bandpass',350,2600,2);osc('sine',380,920,t,.22,.12);},
    surge:()=>{const t=T();osc('sawtooth',180,1700,t,.75,.12,.05);[784,988,1175,1568].forEach((f,i)=>osc('triangle',f,f,t+.5+i*.07,.3,.12));},
    fire:()=>{const t=T();noise(t,.28,.55,'lowpass',3200,260,.9);osc('square',230,48,t,.26,.28);},
    hit:()=>{boom(T(),1);},
    sunk:()=>{const t=T();boom(t,1.5);boom(t+.28,1);osc('sine',520,110,t+.55,1,.16,.05);osc('triangle',330,60,t+.7,1,.12,.05);for(let i=0;i<5;i++)osc('sine',300+Math.random()*500,100,t+.9+i*.11,.12,.08);},
    miss:()=>{const t=T();noise(t,.55,.4,'bandpass',1500,450,2);osc('sine',640,170,t+.04,.26,.22);},
    deflect:()=>{const t=T();osc('sine',1320,1320,t,.6,.22);osc('sine',1760,1760,t,.42,.16);osc('sine',2640,2640,t,.25,.09);osc('square',320,1700,t,.12,.07);noise(t,.1,.2,'highpass',5000,3000);},
    correct:()=>{const t=T();[523,659,784,1047].forEach((f,i)=>osc('triangle',f,f,t+i*.075,.22,.15));osc('sine',2093,2093,t+.3,.3,.06);},
    wrong:()=>{const t=T();osc('sawtooth',190,95,t,.34,.2);osc('sawtooth',150,70,t+.17,.42,.2);},
    error:()=>{const t=T();osc('square',140,100,t,.18,.1);},
    win:()=>{const t=T();[523,659,784,1047,784,1047,1319].forEach((f,i)=>osc('triangle',f,f,t+i*.14,.3,.16));osc('sawtooth',262,262,t,1.2,.05);}
  };
  function stopClip(k){const a=playing[k];if(a){try{a.pause();}catch(e){}delete playing[k];}}
  function play(k){
    if(!on)return;
    const c=custom[k];
    if(c){
      stopClip(k);
      try{const a=new Audio(c.url);a.volume=Math.min(1,vol);playing[k]=a;a.play().catch(()=>{});setTimeout(()=>{if(playing[k]===a)stopClip(k);},MAXCLIP);}catch(e){}
      return;
    }
    try{if(!ensure())return;(synth[k]||synth.click)();}catch(e){}
  }
  /* ---- uploads are kept in IndexedDB so they survive a reload on the same browser ---- */
  function open(){
    return new Promise(res=>{
      try{
        const rq=indexedDB.open('kq-arena-sounds',1);
        rq.onupgradeneeded=()=>rq.result.createObjectStore('clips');
        rq.onsuccess=()=>{db=rq.result;res(true);};
        rq.onerror=()=>{persist=false;res(false);};
      }catch(e){persist=false;res(false);}
    });
  }
  function tx(mode,fn){
    return new Promise(res=>{
      if(!db){res(null);return;}
      try{const t=db.transaction('clips',mode),s=t.objectStore('clips');const r=fn(s);t.oncomplete=()=>res(r&&r.result!==undefined?r.result:true);t.onerror=()=>res(null);}catch(e){res(null);}
    });
  }
  async function load(){
    await open();
    if(!db)return;
    for(const s of SOUND_SLOTS){
      const rec=await tx('readonly',st=>st.get(s.key));
      if(rec&&rec.blob){custom[s.key]={name:rec.name,url:URL.createObjectURL(rec.blob)};}
    }
  }
  async function setClip(k,file){
    if(!file)return{ok:false,msg:'No file chosen.'};
    if(!/^audio\//.test(file.type)&&!/\.(mp3|wav|ogg|m4a|aac|webm)$/i.test(file.name))return{ok:false,msg:'That file is not a sound. Try an MP3, WAV or OGG.'};
    if(file.size>6*1024*1024)return{ok:false,msg:'That file is over 6 MB. Pick a shorter clip.'};
    if(custom[k])URL.revokeObjectURL(custom[k].url);
    custom[k]={name:file.name,url:URL.createObjectURL(file)};
    let saved=false;
    if(db)saved=!!(await tx('readwrite',st=>st.put({name:file.name,blob:file},k)));
    return{ok:true,saved};
  }
  async function clearClip(k){
    stopClip(k);
    if(custom[k]){URL.revokeObjectURL(custom[k].url);delete custom[k];}
    if(db)await tx('readwrite',st=>st.delete(k));
  }
  return{
    play,load,setClip,clearClip,
    clipName:k=>custom[k]?custom[k].name:null,
    unlock:()=>{try{ensure();}catch(e){}},
    get on(){return on;},set on(v){on=!!v;if(!on)Object.keys(playing).forEach(stopClip);},
    get vol(){return vol;},set vol(v){vol=Math.max(0,Math.min(1,v));if(master)master.gain.value=vol;},
    get persists(){return !!db;}
  };
})();

/* ============================ effects: explosions, splashes, shields, confetti ============================ */
const FX=(()=>{
  const cv=document.getElementById('fx'),cx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let ps=[],raf=0,last=0;

    if(/\b(sound|sounds) on\b|\bunmute\b/.test(t)){if(!Snd.on)toggleSound();return'Sound on';}
    if(/\b(next|change|switch|new|different) (theme|look|skin)\b/.test(t)){cycleTheme();return'Next theme';}
    if((c==='ammo'||c==='repair')&&/\bread (the )?(question|it|that|again|aloud|out loud)\b|\brepeat (the )?(question|that|it)\b/.test(t)){readQuestion();return'Reading the question';}

  /* one spoken phrase in -> {ok, act, kind} out */
  function handle(raw){
    let t=norm(raw);

      const m=t.match(/^(?:hey |ok |okay )?(?:computer|zynth|synth|zenith|zinth|sinth)\b\s*/);

      t=t.slice(m[0].length);

/* ---------- roster import (CSV, text, or pasted) ---------- */
function openRoster(){
  const st={parsed:null,mode:'size',n:4,useFile:true,groups:[],over:false};
  openModal(`<h2>Import teams</h2>
    <div class="grid2" style="gap:16px">
      <div class="stack">
        <div><label class="lbl" for="rFile">1. Choose your Leadership export (CSV)</label><input type="file" id="rFile" accept=".csv,.tsv,.txt"></div>
        <div><label class="lbl" for="rText">Or paste a list here</label><textarea id="rText" rows="7" placeholder="Group,Student&#10;S1,First L.&#10;S1,First L.&#10;S2,First L."></textarea></div>
        <p class="note" id="rNote" aria-live="polite">Nothing loaded yet.</p>
      </div>
      <div class="stack">
        <span class="lbl" style="margin:0">2. Check the groups</span>
        <label class="tgl" id="rUseWrap" hidden><span>Use the groups from the file</span><input type="checkbox" id="rUse" checked><span class="tr"><i></i></span></label>
        <div id="rMake" class="seg" style="align-items:center"><button type="button" id="mSize" aria-pressed="true">Groups of</button><button type="button" id="mCount" aria-pressed="false">Number of groups</button><input type="number" id="rN" min="1" max="12" value="4" style="width:84px" aria-label="Number for splitting"></div>
        <div class="glist" id="rList"><p class="note">Groups will show up here.</p></div>
        <button class="btn lg block" id="rApply" disabled>Use these squads</button>
        <button class="btn sm ghost block" id="rCancel">Cancel</button>
      </div></div>`);
  const note=$('#rNote');
  function compute(){
    const p=st.parsed;st.over=false;
    if(!p||!p.names.length){st.groups=[];return;}
    if(p.mode==='groups'&&st.useFile){
      st.over=p.groups.length>MAX_TEAMS;
      st.groups=p.groups.slice(0,MAX_TEAMS).map(g=>({name:/^\d+$/.test(g.name)?'Team '+g.name:g.name,members:g.members}));
      return;
    }
    const total=p.names.length;
    let k=st.mode==='size'?Math.ceil(total/Math.max(1,st.n)):st.n;
    st.over=k>MAX_TEAMS;k=Math.max(1,Math.min(k,MAX_TEAMS,total));
    st.groups=splitGroups(p.names,k,true).map(m=>({name:'',members:m}));
  }
  function paint(){
    const list=$('#rList');
    $('#rUseWrap').hidden=!(st.parsed&&st.parsed.mode==='groups');
    $('#rMake').style.opacity=(st.parsed&&st.parsed.mode==='groups'&&st.useFile)?.45:1;
    $('#mSize').setAttribute('aria-pressed',st.mode==='size');$('#mCount').setAttribute('aria-pressed',st.mode==='count');
    if(!st.groups.length){list.innerHTML='<p class="note">Groups will show up here.</p>';$('#rApply').disabled=true;return;}
    list.innerHTML=st.groups.map((g,i)=>{const c=teamColor(i);return`<div class="g" style="--tc:${c};--ti:${inkFor(c)}"><b>${esc(g.name||defaultName(i))}</b><br>${g.members.map(esc).join(' · ')||'No members'}</div>`;}).join('');
    $('#rApply').disabled=st.groups.length<2;
    $('#rApply').textContent=st.groups.length<2?'Need at least 2 groups':`Use these ${st.groups.length} squads`;
    if(st.over)note.textContent=`That would make more than ${MAX_TEAMS} groups, so the list stops at ${MAX_TEAMS}.`;
  }
  function ingest(text,label){
    st.parsed=parseRoster(text);
    note.textContent=(label?label+': ':'')+st.parsed.note;
    if(st.parsed.mode==='list'&&st.parsed.names.length)st.n=st.mode==='size'?4:Math.max(2,Math.round(st.parsed.names.length/4));
    $('#rN').value=st.n;compute();paint();
  }
  $('#rFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    if(/\.(xlsx|xls|docx|pdf|doc|pages)$/i.test(f.name)){note.textContent='That file type can\'t be read here. Save it as CSV, or paste the names into the box.';return;}
    try{const txt=await f.text();$('#rText').value=txt;ingest(txt,f.name);}catch(err){note.textContent='Could not read that file.';}
  };
  $('#rText').oninput=e=>ingest(e.target.value,'');
  $('#rUse').onchange=e=>{st.useFile=e.target.checked;compute();paint();};
  $('#mSize').onclick=()=>{st.mode='size';st.n=4;$('#rN').value=4;compute();paint();};
  $('#mCount').onclick=()=>{st.mode='count';st.n=Math.max(2,Math.min(MAX_TEAMS,Math.round(((st.parsed&&st.parsed.names.length)||16)/4)));$('#rN').value=st.n;compute();paint();};
  $('#rN').oninput=e=>{st.n=Math.max(1,Math.min(60,Math.round(+e.target.value||1)));compute();paint();};
  $('#rCancel').onclick=closeModal;
  $('#rApply').onclick=()=>{
    const g0=setup.teams[0]?setup.teams[0].grade:3;
    setup.teams=st.groups.map((g,i)=>({name:g.name||defaultName(i),grade:g0,members:g.members}));
    saveSetup();closeModal();renderSetup();Snd.play('correct');
  };
}

let G=null,S=null,timerH=null,qHandle=null;
const memberUp=t=>t.members.length?t.members[t.mi%t.members.length]:null;
function log(m,c=''){G.log.unshift({m,c});if(G.log.length>120)G.log.pop();}
function newSurge(){G.surge=R(0,CATS.length-1)+'-'+R(0,ROWS-1);}
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1440,innerHeight/900));}
addEventListener('resize',fit);
function showGame(on){$('#setup').hidden=on;$('#game').hidden=!on;document.body.classList.toggle('playing',on);if(on){fit();window.scrollTo(0,0);lastView=null;probeSpeed();}}

function startGame(){
  saveSetup();
  const cfg={...setup.cfg};
  const fleets=assignFleets(setup.teams.length,DEFAULT_TEMPLATES,cfg.mix);
  const teams=setup.teams.map((d,i)=>{const t=makeTeam(d,i,cfg,fleets[i]);t.shape=SHAPES[i%8];t.letter=letterFor(t.name,i);t.stats.healed=0;return t;});
  const theme=cfg.surprise?pick(THEME_KEYS):cfg.theme;
  G={cfg,theme,teams,turn:0,used:new Set(),round:1,log:[],usedQ:new Set(),over:false,surge:null,turns:0,className:meta.current};
  S=null;newSurge();
  $('#victory').hidden=true;showGame(true);
  log(`Battle on! ${teams.length} squads, ${cfg.hp} HP each.`,'info');
  renderGame();saveGame();
}
function saveGame(){
  if(!G||G.over)return;
  store.set(ck('save'),{v:3,when:Date.now(),G:{...G,used:[...G.used],usedQ:[...G.usedQ]}});
}
function resumeGame(){
  const s=store.get(ck('save'),null);
  try{
    if(!s||!s.G||!Array.isArray(s.G.teams)||s.G.teams.length<2)throw 0;
    G={...s.G,used:new Set(s.G.used||[]),usedQ:new Set(s.G.usedQ||[]),over:false};
    if(G.teams.some(t=>!Array.isArray(t.ships)||!Array.isArray(t.map)))throw 0;
    if(!G.cfg.v4){G.theme='holo';G.cfg.d3=true;G.cfg.v4=true;}
    S=null;
  }catch(e){store.del(ck('save'));G=null;renderSetup();return;}
  $('#victory').hidden=true;showGame(true);renderGame();
}

/* ---------- rules: hits and repairs ---------- */
function resolveHit(t,si,dmg,lastChance){
  const s=t.ships[si],before=s.hp,taken=Math.min(before,dmg);
  s.hp=before-taken;
  let state='damaged',finishing=0;
  if(s.hits>=s.len){finishing=s.hp;s.hp=0;s.sunk=true;state='holes';}
  else if(s.hp<=0){if(lastChance){s.critical=true;state='critical';}else{s.sunk=true;state='sunk';}}
  if(s.sunk)s.cells.forEach(([r,c])=>t.shots[r][c]='s');
  if(t.ships.every(x=>x.sunk))t.alive=false;
  return{before,taken,state,finishing,eliminated:!t.alive};
}
function resolveRepair(t,si,ok,taken,pct){
  const s=t.ships[si];let heal=0,saved=false,sunk=false;
  if(s.critical){
    s.critical=false;
    if(ok){heal=Math.min(s.maxHp,Math.max(5,r5(taken*pct/100)));s.hp=heal;saved=true;}
    else{s.hp=0;s.sunk=true;sunk=true;s.cells.forEach(([r,c])=>t.shots[r][c]='s');}
  }else if(ok){heal=Math.max(0,Math.min(r5(taken*pct/100),s.maxHp-s.hp));s.hp+=heal;}
  if(t.ships.every(x=>x.sunk))t.alive=false;
  return{heal,saved,sunk,eliminated:!t.alive};
}

  const left=TILES-G.used.size,lim=G.cfg.end==='board'?1:G.cfg.end==='two'?2:0;
  return topBar(`Board ${G.round}${lim?' of '+lim:''} · ${left} tile${left===1?'':'s'} left`)+bannerHtml(t,'Pick a tile!')+`<div class="cols">${leftHtml(t)}${boardHtml()}${standingsHtml()}</div>`;
}
/* effects level: the Look toggle, or automatic if this computer is too slow to animate smoothly */
let autoLite=false,probed=false;
function applyFx(){document.documentElement.classList.toggle('lite',!setup.cfg.fx||autoLite);}
function probeSpeed(){
  if(probed||navigator.webdriver||!setup.cfg.fx)return;
  probed=true;
  let n=0,t0=0;
  setTimeout(()=>{requestAnimationFrame(function f(t){if(!t0)t0=t;n++;if(t-t0<2200)requestAnimationFrame(f);else{
    const fps=n/((t-t0)/1000);
    if(fps<22){autoLite=true;applyFx();Voice.note('Slow computer: effects reduced. You can change this in Look.');}
  }});},2500);
}
let lastView=null;
function renderGame(){
  if(!G)return;
  const stage=$('#stage');
  stage.classList.toggle('compact',G.teams.length>8);
  stage.classList.toggle('d3',!!G.cfg.d3);
  /* camera move only when the screen really changes: zoom in to a question, pull back to the board */
  const view=S?'s:'+S.step:'b:'+G.turn+':'+G.round;
  let anim='';
  if(view!==lastView){
    anim=S?(S.step==='result'?'out':'in'):(lastView&&lastView[0]==='s'?'out':'boot');
    lastView=view;
  }
  stage.dataset.anim=anim;
  stage.innerHTML=S?strikeHtml():turnHtml();
}

/* ============================ strike flow ============================ */
const STEP_NAMES={target:'Pick your target',challenge:'Challenge time',ammo:'Load the ammo',fire:'Fire!',repair:'Repair',result:'Result'};
function openStrike(ci,row){
  if(S||G.over)return;
  const key=ci+'-'+row;if(G.used.has(key))return;
  const atk=G.teams[G.turn],foes=G.teams.filter(t=>t!==atk&&t.alive);
  S={atk,key,ci,row,value:(row+1)*100,surge:G.surge===key,step:'target',target:foes.length===1?foes[0]:null,mult:1,dmg:0,si:-1,shot:null,res:null,ammoQ:null,replQ:null,idea:pick(IDEAS),hit:null,rep:null};
  Snd.play('pick');if(S.surge)setTimeout(()=>Snd.play('surge'),180);
  Voice.say(CATS[ci].name+' '+S.value+(S.surge?', power surge':''));
  goStep(S.target?(G.cfg.challenge?'challenge':'ammo'):'target');
}
function goStep(step){
  stopTimer();qHandle=null;S.step=step;
  if(step==='ammo'){G.used.add(S.key);}
  renderGame();
  if(step==='ammo')mountAmmo();
  if(step==='fire')mountFire();
  if(step==='repair')mountRepair();
  if(step==='result')afterResult();
}
function stopTimer(){if(timerH){clearInterval(timerH);timerH=null;}}
function closeStrike(){stopTimer();qHandle=null;S=null;renderGame();}

const infoLeft=(extra='')=>`<aside class="qleft"><div class="cap">${esc(CATS[S.ci].name)}</div><div class="big">${S.value}</div><div class="cap">points${S.surge?' · power surge x2':''}</div>
  ${S.target?`<div class="cap" style="margin-top:8px">Target</div><div style="font-size:26px;font-weight:700;line-height:1.15">${esc(S.target.name)}</div>`:''}${extra}</aside>`;
const stepChip=()=>`<div class="chips"><span class="chip solid">${STEP_NAMES[S.step]}</span><span class="chip pan">${esc(CATS[S.ci].name)} · ${S.value}</span>${S.surge?'<span class="chip pan">Power surge x2</span>':''}</div>`;
const ringHtml=secs=>secs?`<div class="cap">Timer</div><div class="ring"><svg width="190" height="190" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(var(--inkRgb),.22)" stroke-width="12"/><circle id="ringFill" cx="60" cy="60" r="52" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><div class="n"><b id="tnum">${secs}</b><small>seconds</small></div></div>
  <div class="tctl"><button class="btn sm ghost" id="tplus" style="border-color:var(--ink);color:var(--ink)" aria-label="Add 15 seconds">+15s</button><button class="btn sm ghost" id="tpause" style="border-color:var(--ink);color:var(--ink)" aria-pressed="false">Pause</button></div>`
  :`<div class="cap">Timer</div><div style="font-size:24px;font-weight:700">No timer</div>`;

function strikeHtml(){
  const atk=S.atk,tgt=S.target;
  const defenderTurn=S.step==='repair'||(S.step==='result'&&S.res&&S.res.type==='hit');
  const team=defenderTurn&&tgt?tgt:atk;
  applyTheme(G.theme,team.color);
  const top=topBar(`${esc(STEP_NAMES[S.step])}`);
  let sub='',left='',mid='',right='';

  if(S.step==='target'){
