<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zynth-edu test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  li { margin: .5rem 0; }
  code { background: #eee; padding: 0 .3em; border-radius: 4px; }
  .ok { color: #0a7a2f; font-weight: 600; } .bad { color: #b00020; font-weight: 600; }
</style>
</head>
<body>
<h1>zynth-edu v1 test</h1>
<p id="status">Loading from the TEKS database...</p>
<ol id="list"></ol>
<h2>Search test: "fraction", grade 3</h2>
<ol id="search"></ol>
<script src="./zynth-edu.js"></script>
<script>
  var statusEl = document.getElementById('status');
  function fill(id, rows, n) {
    var ol = document.getElementById(id);
    rows.slice(0, n).forEach(function (r) {
      var li = document.createElement('li');
      var c = document.createElement('code'); c.textContent = r.code;
      li.appendChild(c); li.appendChild(document.createTextNode(' ' + r.text));
      ol.appendChild(li);
    });
  }
  Teks.forGrade(3, { subject: 'pe' }).then(function (rows) {
    statusEl.className = 'ok';
    statusEl.textContent = 'Working! ' + rows.length + ' third-grade PE standards loaded (zynth-edu v' + ZynthEdu.version + '). First 5:';
    fill('list', rows, 5);
    return Teks.search('fraction', { grade: 3 });
  }).then(function (rows) {
    fill('search', rows, 5);
  }).catch(function (e) {
    statusEl.className = 'bad';
    statusEl.textContent = 'Problem: ' + e.message;
  });
</script>
</body>
</html>
